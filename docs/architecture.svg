<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title">
  <title id="title">構成図: ブラウザの分析アプリと確認スクリプトは、HTTPS（8443 番）で Web Gateway に接続し、Web Gateway が IRIS の分析アプリ、認可サーバ、FHIR リポジトリに中継する。2 つのコンテナはネットワークを共有する</title>
  <style>
    /* GitHub のダークモードでも読めるよう、白い背景の上に描く */
    svg { font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, "Noto Sans CJK JP", "BIZ UDPGothic", sans-serif; }
    .b-box { fill: #ffffff; stroke: #2b3a4a; stroke-width: 1.5; }
    .b-soft { fill: #f2f5f7; stroke: #a9b5bd; stroke-width: 1.2; }
    .b-bound { fill: none; stroke: #8c99a3; stroke-width: 1.3; stroke-dasharray: 7 6; }
    .b-auth { fill: #e6eef8; stroke: #1c5ea6; stroke-width: 1.8; }
    .b-fhir { fill: #fbe8dd; stroke: #b3410c; stroke-width: 2; }
    .t-title { font-size: 17px; font-weight: 700; fill: #1a232b; }
    .t { font-size: 15px; fill: #1a232b; }
    .t-b { font-size: 15px; font-weight: 700; fill: #1a232b; }
    .t-sub { font-size: 14px; fill: #53606a; }
    .t-small { font-size: 13px; fill: #53606a; }
    .t-mono { font-family: Consolas, "Courier New", monospace; }
    .t-fhir { fill: #b3410c; font-weight: 700; }
    .ln { stroke: #2b3a4a; stroke-width: 1.6; fill: none; }
    .ln-fhir { stroke: #b3410c; stroke-width: 2; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker>
    <marker id="arr-fhir" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3410c"/></marker>
  </defs>

  <rect width="960" height="500" rx="10" fill="#ffffff"/>

  <rect x="20" y="126" width="194" height="104" rx="8" class="b-box"/>
  <text class="t-small" x="34" y="148">ブラウザ</text>
  <text class="t-title" x="117" y="182" text-anchor="middle">分析アプリ</text>
  <text class="t-sub" x="117" y="206" text-anchor="middle">HTML + JavaScript</text>

  <rect x="20" y="276" width="194" height="84" rx="8" class="b-box"/>
  <text class="t-title" x="117" y="310" text-anchor="middle">確認スクリプト</text>
  <text class="t-sub" x="117" y="334" text-anchor="middle">Python</text>

  <rect x="240" y="22" width="702" height="458" rx="12" class="b-bound"/>
  <text class="t-small" x="256" y="46">Docker Compose（公開するのは 8443 番だけ）</text>

  <rect x="258" y="62" width="206" height="344" rx="8" class="b-soft"/>
  <text class="t-small" x="272" y="84" font-weight="700">webgateway コンテナ</text>
  <rect x="278" y="104" width="166" height="286" rx="6" class="b-box"/>
  <text class="t-title" x="361" y="222" text-anchor="middle">Web Gateway</text>
  <text class="t-sub" x="361" y="246" text-anchor="middle">（Apache）</text>
  <text class="t" x="361" y="276" text-anchor="middle">HTTPS の終端</text>
  <text class="t-mono" x="361" y="300" text-anchor="middle" font-size="14" fill="#53606a">:8443</text>

  <rect x="520" y="62" width="404" height="344" rx="8" class="b-soft"/>
  <text class="t-small" x="534" y="84" font-weight="700">iris コンテナ（IRIS for Health 2026.1 CE）</text>
  <rect x="540" y="104" width="364" height="64" rx="6" class="b-box"/>
  <text class="t-b" x="556" y="130"><tspan class="t-mono" font-size="15">/app</tspan>　分析アプリの配信</text>
  <text class="t-sub" x="556" y="154">Web アプリケーション（静的ファイル）</text>
  <rect x="540" y="192" width="364" height="84" rx="6" class="b-auth"/>
  <text class="t-b" x="556" y="220"><tspan class="t-mono" font-size="15">/oauth2</tspan>　内蔵の OAuth 2.0 認可サーバ</text>
  <text class="t-sub" x="556" y="244">ログイン・同意・トークンの発行</text>
  <text class="t-sub" x="556" y="266">イントロスペクション（トークンの確認）</text>
  <rect x="540" y="322" width="364" height="68" rx="6" class="b-fhir"/>
  <text class="t-b" x="556" y="350"><tspan class="t-mono" font-size="15">/fhir/r4</tspan>　FHIR リポジトリ</text>
  <text class="t-sub" x="556" y="374">スコープで検索結果を絞る</text>

  <line class="ln" x1="214" y1="178" x2="276" y2="178" marker-end="url(#arr)"/>
  <text class="t-small halo" x="245" y="169" text-anchor="middle" font-size="12">HTTPS</text>
  <line class="ln" x1="214" y1="318" x2="276" y2="318" marker-end="url(#arr)"/>
  <text class="t-small halo" x="245" y="309" text-anchor="middle" font-size="12">HTTPS</text>

  <line class="ln" x1="444" y1="136" x2="538" y2="136" marker-end="url(#arr)"/>
  <text class="t-small halo" x="491" y="127" text-anchor="middle" font-size="12">中継</text>
  <line class="ln" x1="444" y1="234" x2="538" y2="234" marker-end="url(#arr)"/>
  <text class="t-small halo" x="491" y="225" text-anchor="middle" font-size="12">中継</text>
  <line class="ln" x1="444" y1="356" x2="538" y2="356" marker-end="url(#arr)"/>
  <text class="t-small halo" x="491" y="347" text-anchor="middle" font-size="12">中継</text>

  <line class="ln ln-fhir" x1="722" y1="322" x2="722" y2="279" marker-end="url(#arr-fhir)"/>
  <text class="t-small t-fhir halo" x="734" y="306" font-size="13">トークンを確認</text>

  <path d="M258,416 V426 H924 V416" fill="none" stroke="#8c99a3" stroke-width="1.3"/>
  <text class="t-sub" x="591" y="450" text-anchor="middle">2 つのコンテナはネットワークを共有（<tspan class="t-mono" font-size="13">network_mode: service:webgateway</tspan>）</text>
  <text class="t-sub" x="591" y="472" text-anchor="middle">ブラウザからも IRIS からも、認可サーバに <tspan class="t-mono" font-size="13">https://localhost:8443/oauth2</tspan> で届く</text>
</svg>
