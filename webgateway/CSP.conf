# Web Gateway（Apache）に追加する設定
CSPModulePath "${ISC_PACKAGE_INSTALLDIR}/bin/"
CSPConfigPath "${ISC_PACKAGE_INSTALLDIR}/bin/"

# 8443 番で HTTPS を受ける。ホストにも同じ 8443 番で公開するので、
# ブラウザと IRIS の両方から https://localhost:8443 で届く
Listen 8443 https

<VirtualHost *:8443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile "/webgateway-shared/certs/server.crt"
    SSLCertificateKeyFile "/webgateway-shared/certs/server.key"

    # /app と /app/ を開いたら、分析アプリの index.html に転送する。
    # IRIS の Web アプリケーションは、フォルダの URL に既定のページ（index.html）を返さないため
    RedirectMatch 302 ^/app/?$ /app/index.html

    # すべてのパスを IRIS に中継する
    <Location />
        CSP On
    </Location>
</VirtualHost>
